services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      PORT: "3000"
      # Both are required; the app stops at start without them.
      APP_SIGNING_SECRET: ${APP_SIGNING_SECRET:-}
      CRED_APP_API_TOKEN: ${CRED_APP_API_TOKEN:-}
    ports:
      - "3000:3000"

volumes:
  db-data:
